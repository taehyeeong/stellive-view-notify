<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STELLIVE 성장 대시보드</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg: #0e0e14;
            --card: #181820;
            --line: #26263180;
            --text: #e9e9f0;
            --muted: #9a9aae;
            --accent: #8b7bf0;
            --accent2: #f06ba8;
            --good: #5ad19b;
            --warn: #f0b93a;
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", sans-serif;
            line-height: 1.5
        }

        .wrap {
            max-width: 1000px;
            margin: 0 auto;
            padding: 22px 18px 80px
        }

        header h1 {
            font-size: 22px;
            font-weight: 800;
            margin: 0 0 4px;
            letter-spacing: -.01em;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            width: fit-content
        }

        header h1 img {
            height: 24px;
            width: auto;
            border-radius: 5px
        }

        header .sub {
            color: var(--muted);
            font-size: 13px
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 20px 0 14px
        }

        .controls input,
        .controls select {
            background: var(--card);
            border: 1px solid var(--line);
            color: var(--text);
            padding: 9px 12px;
            border-radius: 10px;
            font-size: 14px;
            outline: none
        }

        .controls input {
            flex: 1;
            min-width: 160px
        }

        /* 곧 달성 예정 패널 */
        #imminent {
            margin: 0 0 18px
        }

        #imminent h3 {
            font-size: 13px;
            color: var(--warn);
            margin: 0 0 8px;
            letter-spacing: .02em
        }

        .imm-list {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px
        }

        .imm {
            flex: 0 0 auto;
            background: var(--card);
            border: 1px solid var(--warn);
            border-radius: 11px;
            padding: 9px 12px;
            cursor: pointer;
            min-width: 170px
        }

        .imm .t {
            font-weight: 700;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 200px
        }

        .imm .m {
            color: var(--muted);
            font-size: 11px;
            margin-top: 2px
        }

        .imm .eta {
            color: var(--warn);
            font-weight: 700
        }

        #chartCard {
            position: sticky;
            top: 0;
            z-index: 20;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 14px 16px 12px;
            margin-bottom: 18px;
            display: none;
            box-shadow: 0 14px 34px -12px rgba(0, 0, 0, .75)
        }

        #chartCard .head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px
        }

        #chartCard h2 {
            font-size: 15px;
            margin: 0
        }

        #chartCard .meta {
            color: var(--muted);
            font-size: 12px;
            margin: 2px 0 10px
        }

        #closeBtn {
            background: none;
            border: 0;
            color: var(--muted);
            font-size: 18px;
            cursor: pointer;
            line-height: 1;
            padding: 2px 4px
        }

        #closeBtn:hover {
            color: var(--text)
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            align-items: start
        }

        .chartBox {
            position: relative;
            height: 200px
        }

        .videoBox {
            position: relative;
            aspect-ratio: 16/9
        }

        .videoBox iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            border-radius: 10px
        }

        @media(max-width:640px) {
            .grid {
                grid-template-columns: 1fr
            }

            .chartBox {
                height: 170px
            }
        }

        .rank {
            display: flex;
            flex-direction: column;
            gap: 8px
        }

        .row {
            display: grid;
            grid-template-columns: 34px 1fr auto;
            gap: 12px;
            align-items: center;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 12px 14px;
            cursor: pointer;
            transition: border-color .15s
        }

        .row:hover {
            border-color: var(--accent)
        }

        .row.active {
            border-color: var(--accent);
            background: #1f1d2e
        }

        .row .no {
            font-size: 15px;
            font-weight: 800;
            color: var(--muted);
            text-align: center
        }

        .row .no.top {
            color: var(--accent)
        }

        .row .title {
            font-weight: 700;
            font-size: 15px
        }

        .row .artist {
            color: var(--muted);
            font-size: 12px;
            margin-top: 2px
        }

        .row .right {
            text-align: right
        }

        .row .views {
            font-weight: 700;
            font-size: 14px
        }

        .row .score {
            color: var(--good);
            font-size: 12px;
            margin-top: 2px
        }

        .empty {
            color: var(--muted);
            text-align: center;
            padding: 40px
        }

        /* 탭 */
        .tabs {
            display: flex;
            gap: 8px;
            margin: 16px 0 4px
        }

        .tab {
            background: var(--card);
            border: 1px solid var(--line);
            color: var(--muted);
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer
        }

        .tab.active {
            color: var(--text);
            border-color: var(--accent);
            background: #1f1d2e
        }

        /* 명예의 전당 (홀로그램 카드) */
        .holo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 16px;
            margin-top: 6px
        }

        .holo {
            position: relative;
            aspect-ratio: 3/4;
            border-radius: 14px;
            overflow: hidden;
            cursor: pointer;
            transform: perspective(700px) rotateY(var(--rx, 0deg)) rotateX(var(--ry, 0deg));
            transition: transform .12s ease-out;
            background: #12121a;
            box-shadow: 0 8px 24px -10px rgba(0, 0, 0, .7)
        }

        .holo.silver {
            border: 1px solid #b8c2d0
        }

        .holo.gold {
            border: 1px solid #f0c65a;
            box-shadow: 0 8px 30px -8px rgba(240, 198, 90, .4)
        }

        .holo .thumb {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            z-index: 1
        }

        .holo .thumb::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0) 38%, rgba(0, 0, 0, .85))
        }

        .holo .holo-layer {
            position: absolute;
            inset: 0;
            z-index: 2;
            opacity: 0;
            transition: opacity .2s;
            mix-blend-mode: color-dodge;
            filter: brightness(.9) contrast(1.3);
            background-size: 250% 250%;
            background-position: var(--mx, 50%) var(--my, 50%);
            background-image: repeating-linear-gradient(110deg,
                    rgba(255, 0, 132, .5), rgba(255, 235, 0, .5) 12%, rgba(0, 255, 170, .5) 24%,
                    rgba(0, 170, 255, .5) 36%, rgba(170, 0, 255, .5) 48%, rgba(255, 0, 132, .5) 60%)
        }

        .holo.gold .holo-layer {
            background-image: repeating-linear-gradient(110deg,
                    rgba(255, 200, 60, .55), rgba(255, 240, 150, .55) 15%, rgba(255, 170, 40, .55) 30%,
                    rgba(255, 230, 120, .55) 45%, rgba(255, 200, 60, .55) 60%)
        }

        .holo:hover .holo-layer {
            opacity: .6
                /* 반짝임 세기 조절 0.4 ~ 0.8 */
        }

        .holo .glare {
            position: absolute;
            inset: 0;
            z-index: 3;
            opacity: 0;
            transition: opacity .2s;
            mix-blend-mode: overlay;
            background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(255, 255, 255, .5), rgba(255, 255, 255, 0) 45%)
        }

        .holo:hover .glare {
            opacity: 1
        }

        .holo .badge {
            position: absolute;
            top: 8px;
            left: 8px;
            z-index: 4;
            font-size: 11px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 20px;
            background: rgba(0, 0, 0, .6);
            color: #fff
        }

        .holo.gold .badge {
            background: rgba(240, 198, 90, .92);
            color: #3a2c00
        }

        .holo .info {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 4;
            padding: 10px
        }

        .holo .ct {
            font-size: 12px;
            font-weight: 800;
            line-height: 1.25;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden
        }

        .holo .ca {
            font-size: 10px;
            color: #c8c8d8;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .holo .cv {
            font-size: 11px;
            font-weight: 700;
            color: #fff;
            margin-top: 3px
        }

        footer {
            color: var(--muted);
            font-size: 11px;
            text-align: center;
            margin-top: 30px
        }
    </style>
</head>

<body>
    <div class="wrap">
        <header>
            <h1 id="homeBtn"><img src="logo.png" alt="" onerror="this.remove()">STELLIVE 성장 대시보드</h1>
            <div class="sub" id="updated">불러오는 중…</div>
        </header>

        <div class="tabs">
            <button class="tab active" id="tabRank">랭킹</button>
            <button class="tab" id="tabHall">명예의 전당</button>
        </div>

        <div class="controls">
            <input id="search" placeholder="곡·아티스트 검색">
            <select id="unitFilter">
                <option value="">전체 유닛</option>
            </select>
            <select id="sortBy">
                <option value="score">성장 점수순</option>
                <option value="views">조회수순</option>
                <option value="eta">달성 임박순</option>
            </select>
        </div>

        <div id="imminent"></div>

        <div id="chartCard">
            <div class="head">
                <div>
                    <h2 id="chartTitle"></h2>
                    <div class="meta" id="chartMeta"></div>
                </div>
                <button id="closeBtn" title="닫기">✕</button>
            </div>
            <div class="grid">
                <div class="chartBox"><canvas id="chart"></canvas></div>
                <div class="videoBox"><iframe id="ytFrame" allow="encrypted-media" allowfullscreen></iframe></div>
            </div>
        </div>

        <div class="rank" id="rank">
            <div class="empty">데이터 불러오는 중…</div>
        </div>
        <div id="collection" style="display:none"></div>
        <footer>매시간 자동 갱신</footer>
    </div>

    <script>
        // 유닛 → 멤버 (곡에 멤버 전원 있으면 유닛명으로 표시)
        const UNITS = {
            "에버리스": ["아야츠노 유니", "사키하네 후야"],
            "유니버스": ["시라유키 히나", "네네코 마시로", "아카네 리제", "아라하시 타비"],
            "클리셰": ["텐코 시부키", "아오쿠모 린", "하나코 나나", "유즈하 리코"]
        };
        function displayArtists(arr) {
            const list = arr || [];
            const set = new Set(list);
            for (const [u, members] of Object.entries(UNITS)) {
                if (members.length && members.every(m => set.has(m))) {
                    const rest = list.filter(n => !members.includes(n));
                    return [u, ...rest].join(" · ");
                }
            }
            return list.join(", ");
        }

        const DASH_IMMINENT_HOURS = 24;   // 곧 달성 패널: 다음 5만까지 이 시간 이내면 표시
        let SONGS = [], SNAPS = {}, chart = null, activeId = null;

        // 파일을 직접 열면(file://) 브라우저가 로컬 JSON fetch를 차단한다.
        // 그때만 저장소의 최신 공개 데이터로 대체하고, 배포 페이지에서는 상대 경로를 그대로 쓴다.
        const DATA_FALLBACK_BASE =
            "https://raw.githubusercontent.com/taehyeeong/stellive-view-notify/main/";
        function dataUrl(filename) {
            return location.protocol === "file:"
                ? DATA_FALLBACK_BASE + filename
                : new URL(filename, document.baseURI).href;
        }

        async function load() {
            try {
                const [vRes, sRes] = await Promise.all([
                    fetch(dataUrl("dashboard-data"), { cache: "no-store" }),
                    fetch(dataUrl("snapshots.json"), { cache: "no-store" }).catch(() => null)
                ]);
                if (!vRes.ok) throw new Error("views.json을 불러오지 못했습니다.");
                const views = await vRes.json();
                SNAPS = sRes && sRes.ok ? await sRes.json() : {};

                let lastUpdated = "";
                for (const [id, info] of Object.entries(views)) {
                    if (id.startsWith("_") || typeof info !== "object") continue;
                    const artistsArr = info.artists || [];
                    SONGS.push({
                        id, title: info.title || id,
                        artistsArr, artists: displayArtists(artistsArr),
                        unit: info.unit || "", views: info.views || 0,
                        score: info.growth_score || 0,
                        eta: (info.growth && info.growth.eta_days != null) ? info.growth.eta_days : Infinity,
                        daily: (info.growth && info.growth.daily_avg) || 0,
                        remaining: (info.growth && info.growth.remaining) || 0,
                        history: info.history || []
                    });
                    if (info.updated && info.updated > lastUpdated) lastUpdated = info.updated;
                }
                const gp = views["_growth_playlist"];
                document.getElementById("updated").textContent =
                    "마지막 갱신 " + ((gp && gp.updated) || lastUpdated || "-") + " · " + SONGS.length + "곡 추적 중";

                const ORDER = ["스텔라이브", "에버리스", "유니버스", "클리셰", "콜라보", "기타"];
                const present = new Set(SONGS.map(s => s.unit).filter(Boolean));
                const ordered = [...ORDER.filter(u => present.has(u)), ...[...present].filter(u => !ORDER.includes(u)).sort()];
                const uf = document.getElementById("unitFilter");
                ordered.forEach(u => { const o = document.createElement("option"); o.value = u; o.textContent = u; uf.appendChild(o); });

                renderImminent();
                render();
                renderCollection();
            } catch (e) {
                document.getElementById("rank").innerHTML = '<div class="empty">데이터를 불러오지 못했어요. (views.json 경로 확인)</div>';
                document.getElementById("updated").textContent = "불러오기 실패";
            }
        }

        function renderImminent() {
            const el = document.getElementById("imminent");
            const list = SONGS.filter(s => isFinite(s.eta) && s.eta * 24 <= DASH_IMMINENT_HOURS && s.daily > 0)
                .sort((a, b) => a.eta - b.eta).slice(0, 12);
            if (!list.length) { el.innerHTML = ""; return; }
            const cards = list.map(s => {
                const target = s.views + s.remaining;
                const tgt = target % 10000 === 0 ? (target / 10000) + "만" : target.toLocaleString();
                const h = s.eta * 24;
                const eta = h < 1.5 ? "곧 임박" : (h < 24 ? `약 ${Math.round(h)}시간` : `D-${Math.round(s.eta)}`);
                return `<div class="imm" data-id="${s.id}">
      <div class="t">${esc(s.title)}</div>
      <div class="m">${esc(s.artists)} · 🎯 ${tgt} <span class="eta">${eta}</span></div></div>`;
            }).join("");
            el.innerHTML = `<h3>⚡ 곧 달성 예정 (${list.length})</h3><div class="imm-list">${cards}</div>`;
            el.querySelectorAll(".imm").forEach(n =>
                n.onclick = () => { const s = SONGS.find(x => x.id === n.dataset.id); if (s) showChart(s); });
        }

        function render() {
            const q = document.getElementById("search").value.trim().toLowerCase();
            const unit = document.getElementById("unitFilter").value;
            const sortBy = document.getElementById("sortBy").value;
            let list = SONGS.filter(s => {
                if (unit && s.unit !== unit) return false;
                if (q && !(s.title.toLowerCase().includes(q) || s.artists.toLowerCase().includes(q))) return false;
                return true;
            });
            list.sort((a, b) => {
                if (sortBy === "views") return b.views - a.views;
                if (sortBy === "eta") return a.eta - b.eta;
                return b.score - a.score;
            });
            const el = document.getElementById("rank");
            if (!list.length) { el.innerHTML = '<div class="empty">결과 없음</div>'; return; }
            el.innerHTML = "";
            list.slice(0, 100).forEach((s, i) => {
                const row = document.createElement("div");
                row.className = "row" + (s.id === activeId ? " active" : "");
                const etaTxt = isFinite(s.eta) ? ` · 다음 5만까지 D-${Math.max(0, Math.round(s.eta))}` : "";
                row.innerHTML =
                    `<div class="no ${i < 3 ? 'top' : ''}">${i + 1}</div>
       <div><div class="title">${esc(s.title)}</div>
         <div class="artist">${esc(s.artists)}${s.unit ? ` · ${esc(s.unit)}` : ''}</div></div>
       <div class="right"><div class="views">${s.views.toLocaleString()}회</div>
         <div class="score">점수 ${s.score.toFixed(1)}${etaTxt}</div></div>`;
                row.onclick = () => showChart(s);
                el.appendChild(row);
            });
        }

        // 그래프 데이터: 오래된 구간은 snapshots(일별) + 최근 구간은 history(시간별) 이어붙이기
        function seriesFor(s) {
            const hist = (s.history || []).slice().sort((a, b) => a.updated > b.updated ? 1 : -1);
            const earliest = hist.length ? hist[0].updated.slice(0, 10) : null;   // history 시작 날짜
            const pts = [];
            const snap = SNAPS[s.id] || {};
            Object.keys(snap).sort().forEach(d => {                 // history 이전 날짜만 (일별)
                if (!earliest || d < earliest) pts.push({ label: d.slice(5), v: snap[d] });
            });
            hist.forEach(h => pts.push({ label: h.updated.slice(5, 16), v: h.views }));  // 최근 (시간별)
            return pts;
        }

        function showChart(s) {
            if (activeId === s.id) { closeCard(); return; }
            activeId = s.id;
            const pts = seriesFor(s);
            document.getElementById("chartCard").style.display = "block";
            document.getElementById("chartTitle").textContent = s.title;
            document.getElementById("chartMeta").textContent =
                `${s.artists} · 현재 ${s.views.toLocaleString()}회 · 하루 조회수 +${Math.round(s.daily).toLocaleString()}`;
            document.getElementById("ytFrame").src = "https://www.youtube.com/embed/" + s.id;

            const ctx = document.getElementById("chart");
            if (chart) chart.destroy();
            chart = new Chart(ctx, {
                type: "line",
                data: {
                    labels: pts.map(p => p.label),
                    datasets: [{
                        label: "조회수", data: pts.map(p => p.v), borderColor: "#8b7bf0",
                        backgroundColor: "rgba(139,123,240,.12)", fill: true, tension: .3, pointRadius: 0, borderWidth: 2
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    interaction: { mode: "index", intersect: false },
                    plugins: {
                        legend: { display: false },
                        tooltip: { displayColors: false, callbacks: { title: (it) => it[0].label, label: (c) => " " + c.parsed.y.toLocaleString() + "회" } }
                    },
                    scales: {
                        x: { ticks: { color: "#9a9aae", maxTicksLimit: 7 }, grid: { display: false } },
                        y: { beginAtZero: false, ticks: { color: "#9a9aae", maxTicksLimit: 5, callback: v => v.toLocaleString() }, grid: { color: "#26263180" } }
                    }
                }
            });
            render();
        }

        function closeCard() {
            document.getElementById("chartCard").style.display = "none";
            document.getElementById("ytFrame").src = "";
            activeId = null; render();
        }
        function goHome() {
            document.getElementById("search").value = "";
            document.getElementById("unitFilter").value = "";
            document.getElementById("sortBy").value = "score";
            switchView("rank");
            closeCard(); window.scrollTo({ top: 0, behavior: "smooth" });
        }

        // 명예의 전당 (100만+ 달성곡 홀로그램 카드)
        function renderCollection() {
            const el = document.getElementById("collection");   /* 골드 기준 s.views >= 10000000 */
            const list = SONGS.filter(s => s.views >= 1000000).sort((a, b) => b.views - a.views);
            document.getElementById("tabHall").textContent = `명예의 전당 (${list.length})`;
            if (!list.length) { el.innerHTML = '<div class="empty">아직 100만 달성 곡이 없어요.</div>'; return; }
            el.innerHTML = '<div class="holo-grid">' + list.map(s => {
                const gold = s.views >= 10000000;
                const mil = Math.floor(s.views / 1000000) * 100;   // 만 단위
                const thumb = `https://img.youtube.com/vi/${s.id}/hqdefault.jpg`;
                return `<div class="holo ${gold ? 'gold' : 'silver'}" data-id="${s.id}">
      <div class="thumb" style="background-image:url('${thumb}')"></div>
      <div class="holo-layer"></div>
      <div class="glare"></div>
      <div class="badge">${gold ? '👑 ' : ''}${mil}만</div>
      <div class="info">
        <div class="ct">${esc(s.title)}</div>
        <div class="ca">${esc(s.artists)}</div>
        <div class="cv">${s.views.toLocaleString()}회</div>
      </div></div>`;
            }).join('') + '</div>';
            el.querySelectorAll('.holo').forEach(c => {
                c.addEventListener('mousemove', onHoloMove);
                c.addEventListener('mouseleave', () => { c.style.setProperty('--rx', '0deg'); c.style.setProperty('--ry', '0deg'); });
                c.addEventListener('click', () => { const s = SONGS.find(x => x.id === c.dataset.id); if (s) showChart(s); });
            });
        }
        function onHoloMove(e) {
            const c = e.currentTarget, r = c.getBoundingClientRect();
            const px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
            c.style.setProperty('--mx', (px * 100).toFixed(1) + '%');
            c.style.setProperty('--my', (py * 100).toFixed(1) + '%');
            c.style.setProperty('--rx', ((px - .5) * 18).toFixed(1) + 'deg');           /* 기울기 조절 *18 크게 할 수록 많이 기울어짐 */
            c.style.setProperty('--ry', (-(py - .5) * 18).toFixed(1) + 'deg');          /* 기울기 조절 *18 크게 할 수록 많이 기움 */
        }
        function switchView(v) {
            const hall = v === "hall";
            document.getElementById("collection").style.display = hall ? "block" : "none";
            document.getElementById("rank").style.display = hall ? "none" : "flex";
            document.querySelector(".controls").style.display = hall ? "none" : "flex";
            document.getElementById("imminent").style.display = hall ? "none" : "block";
            document.getElementById("tabRank").classList.toggle("active", !hall);
            document.getElementById("tabHall").classList.toggle("active", hall);
        }
        function esc(t) { return (t + "").replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

        document.getElementById("closeBtn").addEventListener("click", closeCard);
        document.getElementById("homeBtn").addEventListener("click", goHome);
        document.getElementById("tabRank").addEventListener("click", () => switchView("rank"));
        document.getElementById("tabHall").addEventListener("click", () => switchView("hall"));
        ["search", "unitFilter", "sortBy"].forEach(id =>
            document.getElementById(id).addEventListener("input", render));
        load();
    </script>
</body>

</html>
