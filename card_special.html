<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <style>
    {
        {
        FONT_FACES
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    html,
    body {
      width: 100%;
      height: 100%
    }

    body {
      font-family: 'Pretendard', 'STIX Two Math', 'Noto Sans Symbols2', 'Noto Sans CJK KR', 'Noto Color Emoji', sans-serif;
      -webkit-font-smoothing: antialiased
    }

    .card {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #15151a;
      container-type: inline-size
    }

    .bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      background-image:url('{{THUMB}}')
    }

    /* 위(제목)·아래(숫자) 모두 살짝 어둡게 — 어떤 썸네일에서도 글자 가독 */
    .wash {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0, 0, 0, .32) 0%, rgba(0, 0, 0, .05) 20%, rgba(0, 0, 0, 0) 44%, rgba(0, 0, 0, .10) 62%, rgba(0, 0, 0, .58) 100%)
    }

    /* 상단 3분할 줄 — 아티스트 정가운데, 양옆은 작게 */
    .top {
      position: absolute;
      top: 5cqw;
      left: 6cqw;
      right: 6cqw;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      column-gap: 3cqw;
      color: #fff;
      text-shadow: 0 1px 8px rgba(0, 0, 0, .35)
    }

    .top .l {
      text-align: left;
      font-size: 1.9cqw;
      letter-spacing: .2em;
      text-transform: uppercase;
      font-weight: 700;
      opacity: .95
    }

    .top .c {
      text-align: center;
      font-size: 2.7cqw;
      letter-spacing: .08em;
      font-weight: 800
    }

    .top .r {
      text-align: right;
      font-size: 1.9cqw;
      letter-spacing: .2em;
      text-transform: uppercase;
      font-weight: 700;
      opacity: .95
    }

    /* 곡 제목 (상단) */
    .song {
      position: absolute;
      top: 12cqw;
      left: 6cqw;
      right: 6cqw;
      text-align: center;
      color: #fff;
      font-size: 8.4cqw;
      font-weight: 800;
      letter-spacing: -.01em;
      line-height: 1.08;
      text-shadow: 0 2px 16px rgba(0, 0, 0, .4)
    }

    /* 거대한 숫자 (아래쪽) — 숫자는 항상 흰색, 추출색은 뒤 글로우로만 */
    .num {
      position: absolute;
      bottom: 9cqw;
      left: 0;
      right: 0;
      text-align: center;
      font-weight: 800;
      font-size: 34cqw;
      line-height: .78;
      letter-spacing: -.055em
    }

    /* 넓게 퍼지는 광(bloom) — 두 겹으로 부드럽게 */
    .num .glow-wide {
      position: absolute;
      inset: 0;

      color: {
          {
          ACCENT
        }
      }

      ;
      filter:blur(58px);
      opacity:.6
    }

    .num .soft {
      position: absolute;
      inset: 0;

      color: {
          {
          ACCENT
        }
      }

      ;
      filter:blur(22px);
      opacity:.9
    }

    .num-wrap {
      position: relative;
      display: inline-block;
      transform: scaleY(1.08)
    }

    .num .fg {
      color: #fff;
      filter: drop-shadow(0 3px 12px rgba(0, 0, 0, .55))
    }

    .num .man {
      font-size: .62em;
      margin-left: .16em
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="bg"></div>
    <div class="wash"></div>

    <div class="top">
      <div class="l">STELLIVE</div>
      <div class="c">{{ARTIST}}</div>
      <div class="r">YouTube Views</div>
    </div>

    <div class="song">{{SONG}}</div>

    <div class="num">
      <span class="num-wrap">
        <span class="glow-wide">{{NUM_MAIN}}<span class="man">{{NUM_UNIT}}</span></span>
        <span class="soft">{{NUM_MAIN}}<span class="man">{{NUM_UNIT}}</span></span>
        <span class="fg">{{NUM_MAIN}}<span class="man">{{NUM_UNIT}}</span></span>
      </span>
    </div>
  </div>

  <script>
    /* 긴 제목이면 카드 안에 맞게 자동 축소 (최대 2줄) */
    (function () {
      var card = document.querySelector('.card');
      var el = document.querySelector('.song');
      var maxH = card.clientHeight * 0.20;   // 제목 최대 높이 (약 2줄)
      var size = parseFloat(getComputedStyle(el).fontSize);
      var guard = 0;
      while (el.scrollHeight > maxH && size > 12 && guard < 400) {
        size -= 1; el.style.fontSize = size + 'px'; guard++;
      }
    })();
  </script>
</body>

</html>
