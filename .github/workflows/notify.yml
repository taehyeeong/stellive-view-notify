name: YouTube View Monitor

on:
  schedule:
    # 매시간 7분에 실행 (감시 장치: 단축어가 빠졌을 때만 대신 돌림)
    - cron: "7 * * * *"

  # 수동 실행 (아이폰 단축어)
  workflow_dispatch:

# 동시에 두 번 실행되는 것 방지
concurrency:
  group: youtube-view-monitor
  cancel-in-progress: false

# 저장된 view 데이터 커밋 + 실행 기록 읽기 허용
permissions:
  contents: write
  actions: read

jobs:
  # 🛡️ 감시 장치: 지난 60분 안에 단축어 실행이 없을 때만 monitor를 돌림
  guard:
    runs-on: ubuntu-latest
    # ⏯️ 스케쥴 토글: 변수 SCHEDULE_ENABLED가 'false'면 감시 장치도 멈춤
    if: github.event_name != 'schedule' || vars.SCHEDULE_ENABLED != 'false'
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # 단축어로 실행된 거면 검사 없이 통과
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # 지난 60분 안에 단축어 실행이 있었는지 확인 (조회 실패하면 0 → 대신 돌림)
          SINCE=$(date -u -d '-60 minutes' +%Y-%m-%dT%H:%M:%SZ)
          COUNT=$(gh api -X GET "repos/${{ github.repository }}/actions/workflows/notify.yml/runs" \
                  -f event=workflow_dispatch -f created=">=$SINCE" --jq '.total_count') || COUNT=0
          if [ "${COUNT:-0}" -gt 0 ]; then
            echo "✅ 단축어 실행 확인 → 건너뜀"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            HOUR=$(TZ=Asia/Seoul date +%H)
            curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT}" \
              --data-urlencode text="⚠️ ${HOUR}시 단축어 자동 실행이 안 됐어요 → GitHub이 대신 돌릴게요"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  monitor:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest

    # 비정상적으로 오래 걸리는 경우 중단 (본 실행 5분 + 카페 12분 + 여유)
    timeout-minutes: 20

    # 🔑 모든 단계가 같이 쓰는 키 (키 추가는 여기 한 군데만)
    env:
      PYTHONUNBUFFERED: "1"
      GROWTH_PLAYLIST_ID: ${{ secrets.GROWTH_PLAYLIST_ID }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      YOUTUBE_API_KEY_2: ${{ secrets.YOUTUBE_API_KEY_2 }}
      YOUTUBE_API_KEY_3: ${{ secrets.YOUTUBE_API_KEY_3 }}
      YOUTUBE_API_KEY_4: ${{ secrets.YOUTUBE_API_KEY_4 }}
      YOUTUBE_API_KEY_5: ${{ secrets.YOUTUBE_API_KEY_5 }}
      YOUTUBE_API_KEY_6: ${{ secrets.YOUTUBE_API_KEY_6 }}
      YOUTUBE_API_KEY_7: ${{ secrets.YOUTUBE_API_KEY_7 }}
      YOUTUBE_API_KEY_8: ${{ secrets.YOUTUBE_API_KEY_8 }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_ID_2: ${{ secrets.YOUTUBE_CLIENT_ID_2 }}
      YOUTUBE_CLIENT_ID_3: ${{ secrets.YOUTUBE_CLIENT_ID_3 }}
      YOUTUBE_CLIENT_ID_4: ${{ secrets.YOUTUBE_CLIENT_ID_4 }}
      YOUTUBE_CLIENT_ID_5: ${{ secrets.YOUTUBE_CLIENT_ID_5 }}
      YOUTUBE_CLIENT_ID_6: ${{ secrets.YOUTUBE_CLIENT_ID_6 }}
      YOUTUBE_CLIENT_ID_7: ${{ secrets.YOUTUBE_CLIENT_ID_7 }}
      YOUTUBE_CLIENT_ID_8: ${{ secrets.YOUTUBE_CLIENT_ID_8 }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_CLIENT_SECRET_2: ${{ secrets.YOUTUBE_CLIENT_SECRET_2 }}
      YOUTUBE_CLIENT_SECRET_3: ${{ secrets.YOUTUBE_CLIENT_SECRET_3 }}
      YOUTUBE_CLIENT_SECRET_4: ${{ secrets.YOUTUBE_CLIENT_SECRET_4 }}
      YOUTUBE_CLIENT_SECRET_5: ${{ secrets.YOUTUBE_CLIENT_SECRET_5 }}
      YOUTUBE_CLIENT_SECRET_6: ${{ secrets.YOUTUBE_CLIENT_SECRET_6 }}
      YOUTUBE_CLIENT_SECRET_7: ${{ secrets.YOUTUBE_CLIENT_SECRET_7 }}
      YOUTUBE_CLIENT_SECRET_8: ${{ secrets.YOUTUBE_CLIENT_SECRET_8 }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_REFRESH_TOKEN_2: ${{ secrets.YOUTUBE_REFRESH_TOKEN_2 }}
      YOUTUBE_REFRESH_TOKEN_3: ${{ secrets.YOUTUBE_REFRESH_TOKEN_3 }}
      YOUTUBE_REFRESH_TOKEN_4: ${{ secrets.YOUTUBE_REFRESH_TOKEN_4 }}
      YOUTUBE_REFRESH_TOKEN_5: ${{ secrets. YOUTUBE_REFRESH_TOKEN_5 }}
      YOUTUBE_REFRESH_TOKEN_6: ${{ secrets.YOUTUBE_REFRESH_TOKEN_6 }}
      YOUTUBE_REFRESH_TOKEN_7: ${{ secrets.YOUTUBE_REFRESH_TOKEN_7 }}
      YOUTUBE_REFRESH_TOKEN_8: ${{ secrets.YOUTUBE_REFRESH_TOKEN_8 }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      NAVER_REFRESH_TOKEN: ${{ secrets.NAVER_REFRESH_TOKEN }}
      CAFE_CLUB_ID: ${{ secrets.CAFE_CLUB_ID }}
      CAFE_MENU_ID: ${{ secrets.CAFE_MENU_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

#      - name: Install Playwright Chromium
#        run: |
#          pip install playwright pillow
#          python -m playwright install --with-deps chromium

      - name: Install packages
        run: |
          pip install -r requirements.txt

      - name: Run monitor
        timeout-minutes: 5
        run: |
          python main.py

      - name: Save views
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add views.json titles.json
          git add bot_state.json 2>/dev/null || true
          git add snapshots.json 2>/dev/null || true
          git add -A share/ 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "Update view count data"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push 재시도 $i..."
            sleep 5
          done
          echo "push 최종 실패"
          exit 1

      - name: Cafe posts
        if: always()
        timeout-minutes: 12
        run: python cafe_runner.py

      - name: Telegram alert on failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="⚠️ 모니터 실행 실패 — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Telegram alert on timeout/cancel
        if: cancelled()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="⏱️ 모니터 취소됨 (타임아웃/hang 의심) — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"