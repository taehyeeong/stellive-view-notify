name: YouTube View Monitor

on:
  schedule:
    # 매시간 43분에 실행
    - cron: "43 * * * *"

  # 수동 실행
  workflow_dispatch:

# 동시에 두 번 실행되는 것 방지
concurrency:
  group: youtube-view-monitor
  cancel-in-progress: false

# 저장된 view 데이터 커밋을 허용
permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    # 비정상적으로 오래 걸리는 경우 중단
    timeout-minutes: 5

    # ⏯️ 스케쥴 토글: 수동 실행은 항상 허용,
    # 정기 실행은 변수 SCHEDULE_ENABLED가 'false'일 때만 멈춤
    if: github.event_name != 'schedule' || vars.SCHEDULE_ENABLED != 'false'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

#      - name: Install Playwright Chromium
#        run: |
#          pip install playwright pillow
#          python -m playwright install --with-deps chromium

      - name: Install packages
        run: |
          pip install -r requirements.txt

      - name: Run monitor
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_API_KEY_2: ${{ secrets.YOUTUBE_API_KEY_2 }}
          YOUTUBE_API_KEY_3: ${{ secrets.YOUTUBE_API_KEY_3 }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_ID_2: ${{ secrets.YOUTUBE_CLIENT_ID_2 }}
          YOUTUBE_CLIENT_ID_3: ${{ secrets.YOUTUBE_CLIENT_ID_3 }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_CLIENT_SECRET_2: ${{ secrets.YOUTUBE_CLIENT_SECRET_2 }}
          YOUTUBE_CLIENT_SECRET_3: ${{ secrets.YOUTUBE_CLIENT_SECRET_3 }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_REFRESH_TOKEN_2: ${{ secrets.YOUTUBE_REFRESH_TOKEN_2 }}
          YOUTUBE_REFRESH_TOKEN_3: ${{ secrets.YOUTUBE_REFRESH_TOKEN_3 }}
        run: |
          python main.py

      - name: Save views
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add views.json titles.json
          git add bot_state.json 2>/dev/null || true
          git add snapshots.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "Update view count data"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push 재시도 $i..."
            sleep 5
          done
          echo "push 최종 실패"
          exit 1


      - name: Send Telegram failure alert
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="⚠️ YouTube Notify GitHub Actions 실패 발생"
